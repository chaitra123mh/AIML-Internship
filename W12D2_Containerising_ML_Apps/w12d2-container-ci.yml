name: W12D2 Container CI

on:
  push:
    branches:
      - feat/aiml-W12-ChaitraMH
    paths:
      - "W12D2_Containerising_ML_Apps/**"
      - ".github/workflows/w12d2-container-ci.yml"
  pull_request:
    branches:
      - feat/aiml-W12-ChaitraMH
    paths:
      - "W12D2_Containerising_ML_Apps/**"
      - ".github/workflows/w12d2-container-ci.yml"

permissions:
  contents: read
  packages: write

jobs:
  lint-test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r W12D2_Containerising_ML_Apps/requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check W12D2_Containerising_ML_Apps

      - name: Run tests
        run: pytest W12D2_Containerising_ML_Apps/test_ml_api.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./W12D2_Containerising_ML_Apps
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/w12d2-ml-api:latest